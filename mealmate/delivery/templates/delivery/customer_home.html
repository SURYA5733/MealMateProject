<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Meal Mate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; color: #0f172a; min-height: 100vh; }
        .navbar { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; sticky: top; z-index: 10; }
        .logo { font-size: 1.35rem; font-weight: 800; color: #4f46e5; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        
        .banner {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 20px -5px rgba(79,70,229,0.3);
            margin-bottom: 2.5rem;
        }
        .banner h3 { font-size: 1.85rem; font-weight: 800; margin-bottom: 0.5rem; }
        .banner p { font-size: 1.05rem; opacity: 0.9; }

        .section-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 1.25rem; color: #0f172a; }

        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.08); }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #e2e8f0; }
        .card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; }
        .restaurant-title { font-size: 1.15rem; font-weight: 700; color: #0f172a; }
        .rating-badge { background: #fef3c7; color: #92400e; font-weight: 700; font-size: 0.8rem; padding: 0.25rem 0.6rem; border-radius: 20px; }
        .cuisine-badge { background: #f1f5f9; color: #475569; font-size: 0.8rem; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 8px; width: fit-content; margin-bottom: 1.25rem; }
        
        .btn-view {
            display: block;
            width: 100%;
            text-align: center;
            padding: 0.75rem;
            background: #eef2ff;
            color: #4f46e5;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-view:hover { background: #4f46e5; color: #ffffff; }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="#" class="logo"><span>🍽️</span> Meal Mate</a>
    </header>

    <main class="container">
        <div class="banner">
            <h3>Welcome {{username}}! 👋</h3>
            <p>Explore top partner restaurants and order your favorites today.</p>
        </div>

        <h2 class="section-title">Popular Restaurants</h2>

        <div class="restaurant-grid">
            {% for r in restaurantList %}
            <div class="card">
                <img src="{{ r.picture }}" alt="{{ r.name }}" class="card-img" onerror="this.src='https://placehold.co/600x400?text=Restaurant'">
                <div class="card-body">
                    <div>
                        <div class="card-header">
                            <h4 class="restaurant-title">{{ r.name }}</h4>
                            <span class="rating-badge">★ {{ r.rating }}</span>
                        </div>
                        <span class="cuisine-badge">{{ r.cuisine }}</span>
                    </div>
                    <a href="{% url 'view_menu' r.id username %}" class="btn-view">View Menu</a>
                </div>
            </div>
            {% empty %}
            <p style="color: #64748b;">No restaurants available right now.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
