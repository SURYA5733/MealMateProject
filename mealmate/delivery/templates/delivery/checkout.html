<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MealMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: radial-gradient(circle at top left, #eef2ff, #f8fafc); color: #0f172a; min-height: 100vh; padding: 3rem 1.5rem; }
        
        .container { max-width: 520px; margin: 0 auto; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 2.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
        
        .header { text-align: center; margin-bottom: 2rem; }
        .header .logo-badge { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header h1 { font-size: 1.75rem; font-weight: 800; color: #0f172a; margin-bottom: 0.25rem; }
        .header p { color: #64748b; font-size: 0.9rem; }

        .error-box { background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; padding: 1rem; border-radius: 12px; font-weight: 600; text-align: center; margin-bottom: 1.5rem; }

        .order-summary { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 16px; padding: 1.25rem; margin-bottom: 1.5rem; }
        .summary-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; margin-bottom: 1rem; }
        
        .order-item { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: 600; color: #334155; padding: 0.5rem 0; border-bottom: 1px dashed #e2e8f0; }
        .order-item:last-child { border-bottom: none; }
        
        .total-box { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 1rem; border-top: 2px solid #e2e8f0; }
        .total-label { font-size: 1.1rem; font-weight: 800; color: #0f172a; }
        .total-price { font-size: 1.5rem; font-weight: 800; color: #4f46e5; }

        .btn-pay {
            width: 100%;
            padding: 1rem;
            background: #4f46e5;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-pay:hover { background: #4338ca; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-badge">💳</div>
                <h1>Checkout</h1>
                <p>Completing order for <strong>{{ username }}</strong></p>
            </div>

            {% if error %}
            <div class="error-box">
                {{ error }}
            </div>
            {% else %}

            <div class="order-summary">
                <div class="summary-title">Items Ordered</div>
                {% for item in cart_items %}
                <div class="order-item">
                    <span>{{ item.name }}</span>
                    <span>₹{{ item.price }}</span>
                </div>
                {% endfor %}

                <div class="total-box">
                    <span class="total-label">Total Amount</span>
                    <span class="total-price">₹{{ total_price }}</span>
                </div>
            </div>

            <!-- Hidden Form to submit payment verification parameters -->
            <form action="{% url 'verify_and_place_order' username %}" method="POST" id="razorpay-form">
                {% csrf_token %}
                <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
                <input type="hidden" name="razorpay_order_id" id="razorpay_order_id" value="{{ order_id }}">
                <input type="hidden" name="razorpay_signature" id="razorpay_signature">
                
                <!-- Matching Button ID -->
                <button type="button" id="rzp-button1" class="btn-pay">
                    🔒 Pay with Razorpay
                </button>
            </form>
            {% endif %}
        </div>
    </div>

    {% if not error %}
    <script>
        var options = {
            "key": "{{ razorpay_key_id }}",
            "amount": {{ amount_in_paise|default:0 }},
            "currency": "INR",
            "name": "MealMate",
            "description": "Food Order Payment",
            "order_id": "{{ order_id }}",
            "theme": { "color": "#4f46e5" },
            "modal": {
                "ondismiss": function() {
                    console.log('Payment modal closed by user');
                    var btn = document.getElementById('rzp-button1');
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = '🔒 Pay with Razorpay';
                    }
                }
            },
            "handler": function (response) {
                var btn = document.getElementById('rzp-button1');
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '⏳ Processing Order...';
                }
                document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
                document.getElementById('razorpay_order_id').value = response.razorpay_order_id || "{{ order_id }}";
                document.getElementById('razorpay_signature').value = response.razorpay_signature;
                document.getElementById('razorpay-form').submit();
            }
        };

        var payBtn = document.getElementById('rzp-button1');
        if (payBtn) {
            payBtn.onclick = function(e) {
                e.preventDefault();
                if (typeof Razorpay === 'undefined') {
                    alert('Razorpay SDK is not loaded. Please check your internet connection.');
                    return;
                }
                var rzp = new Razorpay(options);
                rzp.on('payment.failed', function (resp) {
                    alert('Payment Failed: ' + (resp.error ? resp.error.description : 'Transaction could not be completed.'));
                    payBtn.disabled = false;
                    payBtn.innerHTML = '🔒 Pay with Razorpay';
                });
                rzp.open();
            };
        }
    </script>
    {% endif %}
</body>
</html>
