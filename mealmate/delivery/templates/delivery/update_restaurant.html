<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Restaurant - Meal Mate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: radial-gradient(circle at top left, #eef2ff, #f8fafc); color: #0f172a; min-height: 100vh; padding: 3rem 1.5rem; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 2.25rem; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .back-link { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; font-weight: 700; color: #64748b; text-decoration: none; margin-bottom: 1.25rem; }
        .back-link:hover { color: #0f172a; }
        h2 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.825rem; font-weight: 700; color: #334155; margin-bottom: 0.4rem; }
        input { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.9rem; outline: none; transition: 0.2s; background: #f8fafc; }
        input:focus { border-color: #4f46e5; background: #ffffff; box-shadow: 0 0 0 4px rgba(79,70,229,0.12); }
        button { width: 100%; padding: 0.85rem; background: #4f46e5; color: #fff; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: 0.2s ease; margin-top: 0.5rem; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="card">
        <a href="javascript:history.back()" class="back-link">← Back</a>
        <h2>Update Restaurant Info</h2>

        <form action="{% url 'update_restaurant' restaurant.id %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Restaurant Name</label>
                <input type="text" name="name" value="{{ restaurant.name }}" required>
            </div>
            <div class="form-group">
                <label>Picture URL</label>
                <input type="url" name="picture" value="{{ restaurant.picture }}">
            </div>
            <div class="form-group">
                <label>Cuisine</label>
                <input type="text" name="cuisine" value="{{ restaurant.cuisine }}" required>
            </div>
            <div class="form-group">
                <label>Rating (0.0 to 5.0)</label>
                <input type="number" name="rating" min="0" max="5" step="0.1" value="{{ restaurant.rating }}" required>
            </div>
            <button type="submit">Update Details</button>
        </form>
    </div>
</body>
</html>
